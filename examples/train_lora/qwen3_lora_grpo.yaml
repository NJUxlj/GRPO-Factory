### model
model_name_or_path: Qwen/Qwen3-4B-Instruct

### method
stage: grpo
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### GRPO algorithm settings
grpo_loss_mode: grpo
grpo_num_generations: 8
grpo_temperature: 1.0
grpo_max_response_length: 2048
grpo_clip_ratio: 0.2
grpo_loss_agg_mode: seq-mean-token-mean
grpo_use_kl_loss: true
grpo_kl_coef: 0.001
grpo_kl_type: kl
grpo_norm_adv_by_std: true

### reward
grpo_reward_type: math
grpo_reward_math_extract_mode: boxed

### dataset
dataset: grpo_math_demo
template: qwen3
cutoff_len: 2048

### training
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### output
output_dir: saves/qwen3-4b/lora/grpo
logging_steps: 5
save_steps: 100
plot_loss: true
