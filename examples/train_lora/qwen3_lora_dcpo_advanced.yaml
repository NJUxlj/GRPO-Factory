### model
model_name_or_path: Qwen/Qwen3-4B-Instruct

### method
stage: grpo
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### DCPO Advanced settings (M06)
grpo_loss_mode: dcpo

### Rollout
grpo_num_generations: 16
grpo_temperature: 1.0
grpo_max_response_length: 4096

### DCPO core
dcpo_clip_ratio_low: 0.16
dcpo_clip_ratio_high: 0.20
dcpo_dual_clip_ratio: 10.0
# Use linear_decay: ε_low starts at ε_high and converges to ε_low
dcpo_clip_schedule: linear_decay
dcpo_sas_enable: true
dcpo_sas_threshold: 3.0
dcpo_loss_agg_mode: otm

### DCPO hybrid mode (DAC + GSPO clip_c)
dcpo_hybrid_enable: false
dcpo_hybrid_mode: token-first

### DAPO features
dapo_dynamic_sampling: true
dapo_filter_metric: acc
dapo_overlong_shaping: true
dapo_overlong_buffer_len: 256
dapo_overlong_penalty_factor: 1.0

### KL loss
grpo_use_kl_loss: true
grpo_kl_coef: 0.001
grpo_kl_type: kl

### Rule-based reward (combined with main scoring)
grpo_reward_type: math
grpo_reward_math_extract_mode: boxed
grpo_use_rule_based_reward: false
grpo_rule_based_weight: 0.3

### dataset
dataset: grpo_math_demo
template: qwen3
cutoff_len: 2048

### training
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### output
output_dir: saves/qwen3-4b/lora/dcpo_advanced
logging_steps: 5
save_steps: 100
plot_loss: true
